# Praxis Proxy — gateway configuration
#
# Transparent reverse proxy between request-manager and agent-service.
# Praxis 0.7.0 cannot do JWT validation in Docker networks (SSRF protection
# blocks JWKS fetches to RFC 1918 addresses, kid-matching bug with inline JWK).
#
# Architecture:
#   request-manager → Praxis (:8080) → agent-service (:8080)
#
# Auth is enforced at the application layer (request-manager validates JWTs,
# agent-service runs policy_client.py permission checks). The PPE policy
# filter here is set to allow-all. See policy.yaml for details.

admin:
  address: "127.0.0.1:9901"

body_limits:
  max_request_bytes: 10485760
  max_response_bytes: 10485760

runtime:
  threads: 0
  work_stealing: true
  upstream_keepalive_pool_size: 32

shutdown_timeout_secs: 15

listeners:
  - name: gateway
    address: "0.0.0.0:8080"
    max_connections: 1000
    downstream_read_timeout_ms: 30000
    filter_chains:
      - security
      - routing

filter_chains:
  - name: security
    filters:
      - filter: request_id
      - filter: access_log
      - filter: policy
        config_path: /etc/praxis/policy.yaml

  - name: routing
    filters:
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: agent-service
      - filter: load_balancer
        clusters:
          - name: agent-service
            connection_timeout_ms: 5000
            read_timeout_ms: 120000
            idle_timeout_ms: 60000
            endpoints:
              - "partner-agent-service-full:8080"

insecure_options:
  allow_private_endpoints: true
  allow_private_upstreams: true
