# Praxis Policy Engine (PPE) — JWT-validated gateway policy
#
# Praxis 0.7.1 fixes SSRF blocks on RFC 1918 JWKS fetches and the
# kid-matching bug, enabling gateway-level JWT validation.
#
# Authentication: identity/jwt plugin validates tokens from Keycloak
# Authorization: requires authenticated requests (valid JWT)
#
# Health checks use the admin port (/ready on 127.0.0.1:9901),
# not the proxy port, so no path-based auth bypass is needed.

engine_settings:
  dispatch: policy

plugins:
- name: keycloak-jwt
  kind: identity/jwt
  hooks:
  - identity.resolve
  on_error: fail
  capabilities:
  - perform_http
  config:
    role: user
    header: Authorization
    trusted_issuers:
    - issuer: http://partner-keycloak-full:8090/realms/partner-agent
      algorithms:
      - RS256
      audiences:
      - partner-agent-ui
      - agent-service
      - kubernetes-agent
      decoding_key:
        kind: jwks_url
        url: http://partner-keycloak-full:8090/realms/partner-agent/protocol/openid-connect/certs
        insecure_http: true
    claim_mapper: keycloak

global:
  attribute_files:
    - /etc/praxis/agent_capabilities.yaml

  authentication:
  - keycloak-jwt

  authorization:
    pre_invocation:
    - require(authenticated)
