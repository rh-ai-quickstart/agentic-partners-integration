{{- $fullName := include "partner-agent.fullname" . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
type: Opaque
data:
  host: {{ printf "%s-postgresql" $fullName | b64enc | quote }}
  port: {{ "5432" | b64enc | quote }}
  dbname: {{ .Values.postgresql.auth.database | b64enc | quote }}
  user: {{ .Values.postgresql.auth.username | b64enc | quote }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  url: {{ printf "postgresql+asyncpg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password $fullName .Values.postgresql.auth.database | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-llm-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
type: Opaque
data:
  llm-backend: {{ .Values.llm.backend | b64enc | quote }}
  {{- if .Values.llm.apiKey }}
  ai-api-key: {{ .Values.llm.apiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.geminiApiKey }}
  ai-gemini-api-key: {{ .Values.llm.geminiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.openaiApiKey }}
  ai-openai-api-key: {{ .Values.llm.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.anthropicApiKey }}
  ai-anthropic-api-key: {{ .Values.llm.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.llm.googleApiKey }}
  google-api-key: {{ .Values.llm.googleApiKey | b64enc | quote }}
  {{- end }}
  gemini-model: {{ .Values.llm.geminiModel | b64enc | quote }}
  openai-model: {{ .Values.llm.openaiModel | b64enc | quote }}
  ollama-base-url: {{ .Values.llm.ollamaBaseUrl | b64enc | quote }}
  ollama-model: {{ .Values.llm.ollamaModel | b64enc | quote }}
---
{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-keycloak-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.keycloak.adminPassword | b64enc | quote }}
{{- end }}
---
{{- if and .Values.azureMcpServer .Values.azureMcpServer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-azure-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
type: Opaque
data:
  tenant-id: {{ .Values.azure.tenantId | default "" | b64enc | quote }}
  client-id: {{ .Values.azure.clientId | default "" | b64enc | quote }}
  client-secret: {{ .Values.azure.clientSecret | default "" | b64enc | quote }}
  subscription-id: {{ .Values.azure.subscriptionId | default "" | b64enc | quote }}
{{- end }}
