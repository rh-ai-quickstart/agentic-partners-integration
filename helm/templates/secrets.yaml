{{- $fullName := include "partner-agent.fullname" . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
type: Opaque
data:
  host: {{ printf "%s-postgresql" $fullName | b64enc | quote }}
  port: {{ "5432" | b64enc | quote }}
  dbname: {{ .Values.postgresql.auth.database | b64enc | quote }}
  user: {{ .Values.postgresql.auth.username | b64enc | quote }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  url: {{ printf "postgresql+asyncpg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password $fullName .Values.postgresql.auth.database | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-llm-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
type: Opaque
data:
  llm-backend: {{ .Values.llm.backend | b64enc | quote }}
  ai-api-key: {{ (.Values.llm.apiKey | default "") | b64enc | quote }}
  ai-gemini-api-key: {{ (.Values.llm.geminiApiKey | default "") | b64enc | quote }}
  ai-openai-api-key: {{ (.Values.llm.openaiApiKey | default "") | b64enc | quote }}
  ai-anthropic-api-key: {{ (.Values.llm.anthropicApiKey | default "") | b64enc | quote }}
  ai-model: {{ (.Values.llm.model | default "gemini-2.5-flash") | b64enc | quote }}
  google-api-key: {{ (.Values.llm.googleApiKey | default "") | b64enc | quote }}
  gemini-model: {{ .Values.llm.geminiModel | b64enc | quote }}
  openai-model: {{ .Values.llm.openaiModel | b64enc | quote }}
  openai-base-url: {{ (.Values.llm.openaiBaseUrl | default "") | b64enc | quote }}
  ollama-base-url: {{ .Values.llm.ollamaBaseUrl | b64enc | quote }}
  ollama-model: {{ .Values.llm.ollamaModel | b64enc | quote }}
---
{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-keycloak-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.keycloak.adminPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-seed-results
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  client-secret: {{ "" | b64enc | quote }}
  dcr-initial-access-token: {{ "" | b64enc | quote }}
{{- end }}
