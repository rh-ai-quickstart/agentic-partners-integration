{{- $fullName := include "partner-agent.fullname" . -}}
{{- if .Values.azureMcpServer.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-azure-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
    app: {{ $fullName }}-azure-mcp-server
    component: azure-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "partner-agent.selectorLabels" . | nindent 6 }}
      app: {{ $fullName }}-azure-mcp-server
  template:
    metadata:
      labels:
        {{- include "partner-agent.labels" . | nindent 8 }}
        app: {{ $fullName }}-azure-mcp-server
        component: azure-mcp-server
    spec:
      serviceAccountName: {{ include "partner-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: azure-mcp-server
        image: "{{ .Values.azureMcpServer.image.repository }}:{{ .Values.azureMcpServer.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/mcp-server/azmcp"]
        args:
          - "server"
          - "start"
          - "--transport"
          - "http"
          - "--read-only"
          - "--outgoing-auth-strategy"
          - "UseHostingEnvironmentIdentity"
        ports:
        - containerPort: 8080
          protocol: TCP
          name: http
        env:
        - name: HOME
          value: /tmp
        - name: DOTNET_ROOT
          value: /usr/lib64/dotnet
        - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
          value: /tmp/.net
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        # Azure AD incoming auth (JWT Bearer validation)
        - name: AzureAd__ClientId
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-azure-credentials
              key: client-id
              optional: true
        - name: AzureAd__TenantId
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-azure-credentials
              key: tenant-id
              optional: true
        - name: AzureAd__Instance
          value: "https://login.microsoftonline.com/"
        # Azure outgoing auth (service principal for Azure API calls)
        - name: AZURE_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-azure-credentials
              key: tenant-id
              optional: true
        - name: AZURE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-azure-credentials
              key: client-id
              optional: true
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-azure-credentials
              key: client-secret
              optional: true
        - name: AZURE_SUBSCRIPTION_ID
          valueFrom:
            secretKeyRef:
              name: {{ $fullName }}-azure-credentials
              key: subscription-id
              optional: true
        {{- if .Values.azureMcpServer.resources }}
        resources:
          {{- toYaml .Values.azureMcpServer.resources | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-azure-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
    app: {{ $fullName }}-azure-mcp-server
spec:
  type: ClusterIP
  selector:
    {{- include "partner-agent.selectorLabels" . | nindent 4 }}
    app: {{ $fullName }}-azure-mcp-server
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
{{- end }}
