{{- if .Values.externalSecrets.enabled }}
{{- $fullName := include "partner-agent.fullname" . -}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullName }}-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.store.kind }}
    name: {{ .Values.externalSecrets.store.name }}
  target:
    name: {{ $fullName }}-db-credentials
    creationPolicy: Owner
  data:
  - secretKey: host
    remoteRef:
      key: {{ .Values.externalSecrets.keys.dbPassword }}
      property: host
  - secretKey: port
    remoteRef:
      key: {{ .Values.externalSecrets.keys.dbPassword }}
      property: port
  - secretKey: dbname
    remoteRef:
      key: {{ .Values.externalSecrets.keys.dbPassword }}
      property: dbname
  - secretKey: user
    remoteRef:
      key: {{ .Values.externalSecrets.keys.dbUsername }}
      property: username
  - secretKey: password
    remoteRef:
      key: {{ .Values.externalSecrets.keys.dbPassword }}
      property: password
  - secretKey: url
    remoteRef:
      key: {{ .Values.externalSecrets.keys.dbPassword }}
      property: url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullName }}-llm-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.store.kind }}
    name: {{ .Values.externalSecrets.store.name }}
  target:
    name: {{ $fullName }}-llm-credentials
    creationPolicy: Owner
  data:
  - secretKey: llm-backend
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: backend
  - secretKey: ai-api-key
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: api-key
  - secretKey: ai-gemini-api-key
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: gemini-api-key
  - secretKey: ai-openai-api-key
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: openai-api-key
  - secretKey: openai-api-key
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: openai-api-key
  - secretKey: ai-anthropic-api-key
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: anthropic-api-key
  - secretKey: ai-model
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: model
  - secretKey: google-api-key
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: google-api-key
  - secretKey: gemini-model
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: gemini-model
  - secretKey: openai-model
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: openai-model
  - secretKey: openai-base-url
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: openai-base-url
  - secretKey: ollama-base-url
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: ollama-base-url
  - secretKey: ollama-model
    remoteRef:
      key: {{ .Values.externalSecrets.keys.llmApiKey }}
      property: ollama-model
{{- if .Values.keycloak.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullName }}-keycloak-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.store.kind }}
    name: {{ .Values.externalSecrets.store.name }}
  target:
    name: {{ $fullName }}-keycloak-credentials
    creationPolicy: Owner
  data:
  - secretKey: admin-password
    remoteRef:
      key: {{ .Values.externalSecrets.keys.keycloakAdmin }}
      property: admin-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullName }}-seed-results
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.store.kind }}
    name: {{ .Values.externalSecrets.store.name }}
  target:
    name: {{ $fullName }}-seed-results
    creationPolicy: Owner
  data:
  - secretKey: client-secret
    remoteRef:
      key: {{ .Values.externalSecrets.keys.keycloakAdmin }}
      property: client-secret
  - secretKey: dcr-initial-access-token
    remoteRef:
      key: {{ .Values.externalSecrets.keys.keycloakAdmin }}
      property: dcr-initial-access-token
{{- end }}
{{- end }}
