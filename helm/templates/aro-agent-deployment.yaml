{{- $fullName := include "partner-agent.fullname" . -}}
{{- if .Values.aroAgent.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-aro-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
    app: {{ $fullName }}-aro-agent
    component: aro-agent
spec:
  replicas: {{ .Values.aroAgent.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "partner-agent.selectorLabels" . | nindent 6 }}
      app: {{ $fullName }}-aro-agent
  template:
    metadata:
      labels:
        {{- include "partner-agent.labels" . | nindent 8 }}
        app: {{ $fullName }}-aro-agent
        component: aro-agent
    spec:
      serviceAccountName: {{ include "partner-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: aro-agent
        image: "{{ .Values.image.registry }}/{{ .Values.image.aroAgent }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
          protocol: TCP
          name: http
        env:
        {{- include "partner-agent.llmEnvVars" . | nindent 8 }}
        - name: MCP_SERVER_URL
          value: {{ .Values.aroAgent.mcpServerUrl | default (printf "http://%s-azure-mcp-server/" $fullName) | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.logLevel | default "INFO" | quote }}
        {{- if .Values.aroAgent.resources }}
        resources:
          {{- toYaml .Values.aroAgent.resources | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-aro-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "partner-agent.labels" . | nindent 4 }}
    app: {{ $fullName }}-aro-agent
spec:
  type: ClusterIP
  selector:
    {{- include "partner-agent.selectorLabels" . | nindent 4 }}
    app: {{ $fullName }}-aro-agent
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
{{- end }}
