# Default values for partner-agent

# Global log level for all services (DEBUG, INFO, WARNING, ERROR)
logLevel: "INFO"

# Custom images (built via GitHub Actions)
image:
  registry: ghcr.io/rh-ai-quickstart
  agentService: partner-agent-service
  requestManager: partner-request-manager
  ragApi: partner-rag-api
  pfChatUi: partner-pf-chat-ui
  kubernetesAgent: partner-kubernetes-agent
  aroAgent: partner-aro-agent
  azureMcpServer: partner-azure-mcp-server
  pullPolicy: Always
  tag: "latest"

# Service account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Database configuration
database:
  # Expected Alembic migration version
  expectedMigrationVersion: "009"

# PostgreSQL with pgvector for both application data and vector storage
postgresql:
  image: pgvector/pgvector:pg16
  auth:
    username: postgres
    password: rag_password
    database: partner_agent
  storage: 5Gi
  storageClass: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# RAG API service
ragApi:
  replicas: 1
  embeddingModel: "models/gemini-embedding-001"
  llmModel: "gemini-2.5-flash"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# LLM credentials (set via --set or external secret)
llm:
  # New configuration (recommended)
  provider: "gemini"  # gemini, openai, ollama, anthropic
  apiKey: ""  # Universal API key
  model: "gemini-2.5-flash"  # Universal model name

  # Provider-specific keys (optional, for multi-provider setups)
  geminiApiKey: ""
  openaiApiKey: ""
  anthropicApiKey: ""

  # Legacy configuration (deprecated)
  backend: "gemini"  # Deprecated: use 'provider' instead
  googleApiKey: ""  # Deprecated: use 'apiKey' or 'geminiApiKey'
  geminiModel: "gemini-2.5-flash"  # Deprecated: use 'model'
  openaiModel: "gpt-4"  # Deprecated: use 'model'

  # Ollama
  ollamaBaseUrl: "http://ollama:11434"
  ollamaModel: "llama3.1"

# Request Manager
requestManager:
  replicas: 1
  uvicornWorkers: 4
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
  externalAccess:
    enabled: false
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

# Agent Service
agentService:
  replicas: 1
  uvicornWorkers: 4
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

# PF Chat UI (nginx serving PatternFly chat interface)
pfChatUi:
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# Database migration job
dbMigration:
  enabled: true
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"

# Network policies
networkPolicies:
  enabled: true
  # Platform: "openshift", "kind", or "none"
  platform: "openshift"

# Keycloak OIDC authentication
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak
  tag: "26.5"
  adminUsername: admin
  adminPassword: admin123  # Change in production - use external secret
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# OPA policy engine
opa:
  enabled: true
  image: openpolicyagent/opa
  tag: "latest"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Kubernetes Partner Agent
kubernetesAgent:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Azure MCP Server (ARO-specific - disable for main branch)
azureMcpServer:
  enabled: true
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "300m"

# ARO Partner Agent (ARO-specific - disable for main branch)
aroAgent:
  enabled: true
  replicas: 1
  mcpServerUrl: ""  # Auto-configures to azure-mcp-server service if empty
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Azure credentials (for Azure MCP server)
azure:
  tenantId: ""
  clientId: ""
  clientSecret: ""
  subscriptionId: ""
