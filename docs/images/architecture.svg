<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Title -->
  <text x="400" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Multi-Agent Partner Support Architecture
  </text>

  <!-- User Layer -->
  <rect x="300" y="50" width="200" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1565c0">Web Browser</text>
  <text x="400" y="88" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">(PatternFly UI)</text>

  <!-- Authentication Layer -->
  <g id="auth-layer">
    <rect x="50" y="150" width="150" height="50" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
    <text x="125" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e65100">Keycloak</text>
    <text x="125" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">OIDC Auth</text>

    <rect x="250" y="150" width="150" height="50" fill="#fce4ec" stroke="#c62828" stroke-width="2" rx="5"/>
    <text x="325" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">OPA</text>
    <text x="325" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Policy Engine</text>
  </g>

  <!-- Request Manager -->
  <rect x="300" y="250" width="200" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e7d32">Request Manager</text>
  <text x="400" y="288" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">API Gateway</text>

  <!-- Router -->
  <rect x="300" y="350" width="200" height="50" fill="#fff3e0" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e65100">AI Router</text>
  <text x="400" y="388" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Intent Classification</text>

  <!-- Specialist Agents -->
  <g id="agents">
    <rect x="50" y="450" width="150" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="125" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">Software Agent</text>
    <text x="125" y="488" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">App Issues</text>

    <rect x="250" y="450" width="150" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="325" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">Network Agent</text>
    <text x="325" y="488" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">VPN/Connectivity</text>

    <rect x="450" y="450" width="150" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="525" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2e7d32">Kubernetes Agent</text>
    <text x="525" y="488" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Pod/Cluster Issues</text>
  </g>

  <!-- RAG & Database -->
  <g id="knowledge">
    <rect x="650" y="350" width="130" height="50" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" rx="5"/>
    <text x="715" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6a1b9a">RAG API</text>
    <text x="715" y="388" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Vector Search</text>

    <rect x="650" y="450" width="130" height="50" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" rx="5"/>
    <text x="715" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6a1b9a">PostgreSQL</text>
    <text x="715" y="488" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">pgvector</text>
  </g>

  <!-- LLM -->
  <rect x="300" y="530" width="200" height="50" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="5"/>
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f57f17">Ollama</text>
  <text x="400" y="568" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Llama 3.2 (Default)</text>

  <!-- Arrows -->
  <!-- User to Request Manager -->
  <line x1="400" y1="100" x2="400" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Request Manager to Auth -->
  <line x1="300" y1="270" x2="200" y2="190" stroke="#666" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="300" y1="280" x2="250" y2="190" stroke="#666" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Request Manager to Router -->
  <line x1="400" y1="300" x2="400" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Router to Agents -->
  <line x1="350" y1="400" x2="150" y2="450" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="400" x2="325" y2="450" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="400" x2="500" y2="450" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Agents to RAG -->
  <line x1="600" y1="470" x2="650" y2="380" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- RAG to Database -->
  <line x1="715" y1="400" x2="715" y2="450" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Agents/Router to LLM -->
  <line x1="400" y1="400" x2="400" y2="530" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="125" y1="500" x2="350" y2="540" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g id="legend" transform="translate(20, 530)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Key:</text>
    <line x1="0" y1="12" x2="30" y2="12" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="35" y="16" font-family="Arial, sans-serif" font-size="9" fill="#666">Request Flow</text>
    <line x1="0" y1="28" x2="30" y2="28" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="35" y="32" font-family="Arial, sans-serif" font-size="9" fill="#666">LLM/RAG Query</text>
  </g>
</svg>
